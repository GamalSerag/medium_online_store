{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<section class="min-h-[70vh] bg-[#fdfbf7] px-4 py-12 sm:px-6 flex items-center justify-center">
    <div class="w-full max-w-md rounded-lg border border-black/10 bg-[#f7f4ee] p-5 sm:p-8">
        <p class="text-center text-xs font-bold uppercase tracking-[0.22em] text-[#7b563f]">{% trans "Staff access" %}</p>
        <h1 class="home-display mt-2 text-center text-4xl font-bold text-gray-950">{% trans "Login" %}</h1>

        <form method="post" class="login-form mt-8">
            {% csrf_token %}
            <div class="space-y-5">
                {{ form.as_p }}
            </div>
            <button type="submit" class="mt-7 flex min-h-12 w-full items-center justify-center rounded-lg bg-gray-950 px-6 text-sm font-bold text-white hover:bg-[#a64224] transition-colors">
                {% trans "Login" %}
            </button>
        </form>
    </div>
</section>
{% endblock %}
