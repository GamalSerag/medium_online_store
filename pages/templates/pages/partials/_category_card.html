{% load i18n %}
<a href="{% url 'category_products' category.slug %}"
    class="group block min-w-0 overflow-hidden rounded-lg border border-black/10 bg-[#fdfbf7] transition-all duration-300 hover:-translate-y-0.5 hover:shadow-[0_16px_34px_rgba(20,20,20,0.08)]">
    <div class="aspect-[4/3] overflow-hidden bg-[#ece7de]">
        {% if category.image %}
        <img src="{{ category.image.url }}" alt="{{ category.name }}"
            class="w-full h-full object-cover group-hover:scale-[1.04] transition-transform duration-500">
        {% else %}
        <div class="w-full h-full flex items-center justify-center text-sm font-medium text-gray-400">
            {% trans "Category" %}
        </div>
        {% endif %}
    </div>
    <div class="flex items-center justify-between gap-2 p-2.5 sm:gap-3 sm:p-3">
        <h3 class="truncate text-xs font-bold text-gray-950 group-hover:text-[#a64224] transition-colors sm:text-sm">
            {{ category.name }}
        </h3>
        <span class="shrink-0 text-[11px] font-semibold text-gray-400 group-hover:text-[#a64224] sm:text-xs">{% trans "View" %}</span>
    </div>
</a>
